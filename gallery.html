    <p data-i18n="galleryDesc">레모네이드 포 올 팀원들이 직접 담은 활동 현장의 순간들입니다.</p>
  </section>

  <section id="gallery-filter">
    <button class="filter-btn active" data-filter="all" data-i18n="filterAll">전체</button>
    <button class="filter-btn" data-filter="cambodia" data-i18n="filterCambodia">캄보디아</button>

  <section id="gallery-grid" class="gallery-grid">
    <figure class="gallery-item" data-category="cambodia">
      <img src="images/gallery/cambodia-01.jpg" alt="캄보디아 물품 전달" loading="lazy">
      <figcaption>캄보디아 물품 전달 · 2026.03</figcaption>
    </figure>
    <figure class="gallery-item" data-category="campaign">
      <img src="images/gallery/campaign-01.jpg" alt="기부 인식 캠페인" loading="lazy">
      <figcaption>기부 인식 캠페인 · 2026.02</figcaption>
    </figure>
    <figure class="gallery-item" data-category="team">
      <img src="images/gallery/team-01.jpg" alt="팀 회의" loading="lazy">
      <figcaption>팀 회의 · 2026.01</figcaption>
    </figure>
  </section>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <button class="lightbox-prev" id="lightboxPrev">&#8249;</button>
    <img src="" alt="" id="lightboxImg">
    <button class="lightbox-next" id="lightboxNext">&#8250;</button>
    <p class="lightbox-caption" id="lightboxCaption"></p>
